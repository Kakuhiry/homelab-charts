---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-recovery
  namespace: longhorn

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-recovery
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-recovery
subjects:
- kind: ServiceAccount
  name: longhorn-recovery
  namespace: longhorn

---
apiVersion: v1
kind: Secret
metadata:
  name: egbp-nuc-ssh-key
  namespace: longhorn
type: Opaque
data:
  id_ed25519: 

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-recovery
  namespace: longhorn
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: longhorn-recovery
          nodeSelector:
            kubernetes.io/hostname: egbp
          restartPolicy: Never
          volumes:
          - name: ssh-key
            secret:
              secretName: egbp-nuc-ssh-key
              defaultMode: 0400
          containers:
          - name: recovery
            image: alpine/k8s:1.27.13
            volumeMounts:
            - name: ssh-key
              mountPath: /ssh
            command:
            - /bin/sh
            - -c
            - |
              BAD=$(kubectl get pods -n longhorn -l longhorn.io/component=share-manager                 --no-headers 2>/dev/null | awk '$2!="1/1" || $3!="Running"' | wc -l | tr -d ' ')

              if [ "$BAD" -eq 0 ]; then
                echo "[$(date -u +%H:%M:%S)] share-managers OK"
                exit 0
              fi

              echo "[$(date -u +%H:%M:%S)] $BAD broken share-managers — recovering"

              kubectl delete pod -n longhorn                 -l longhorn.io/node=egbp-nuc,longhorn.io/component=instance-manager                 --ignore-not-found 2>/dev/null || true

              RECOVERED=0
              i=0
              while [ $i -lt 30 ]; do
                sleep 3
                BAD=$(kubectl get pods -n longhorn -l longhorn.io/component=share-manager                   --no-headers 2>/dev/null | awk '$2!="1/1" || $3!="Running"' | wc -l | tr -d ' ')
                [ "$BAD" -eq 0 ] && RECOVERED=1 && break
                i=$((i+1))
              done

              if [ "$RECOVERED" -eq 0 ]; then
                echo "[$(date -u +%H:%M:%S)] still broken — restarting k3s-agent on egbp-nuc"
                ssh -i /ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10                   egbp@10.0.0.23 'echo 2630 | sudo -S systemctl restart k3s-agent' 2>/dev/null || true
                sleep 45
              fi

              STUCK=$(kubectl get pods -n media --no-headers 2>/dev/null |                 awk '$3=="Terminating"' | wc -l | tr -d ' ')
              if [ "$STUCK" -gt 0 ]; then
                echo "[$(date -u +%H:%M:%S)] force-deleting $STUCK stuck media pods"
                kubectl get pods -n media --no-headers 2>/dev/null |                   awk '$3=="Terminating" {print $1}' |                   xargs -r kubectl delete pod -n media --force --grace-period=0 2>/dev/null || true
              fi

              echo "[$(date -u +%H:%M:%S)] done"
