nfsServer:
  # itsthenetwork/nfs-server-alpine is amd64-only (confirmed via manifest
  # inspection) and fails with "exec format error" on egbo (arm64). This
  # fork is genuinely multi-arch (confirmed linux/arm64 in its manifest).
  image: mekayelanik/nfs-server-alpine:latest
  pullPolicy: IfNotPresent
  # Exports named shares under /data: /data/movies, /data/tv, /data/downloads,
  # /data/general-downloads.
  # Was 10.42.0.0/16 (cluster pod CIDR only) -- widened to allow the LAN too
  # (matches the trust posture already used by every other NFS export in
  # this homelab -- USB/NVMe backup targets on egbo are unrestricted "*",
  # no_root_squash). Without this, LAN clients (e.g. mounting from a
  # laptop) can't mount any share here at all, pods or not.
  allowedClient: "*"
  # Default of 4 nfsd threads serialized concurrent writes during the initial
  # data migration far below available CPU/network headroom -- bumped up.
  threadCount: 16
  exports:
    - movies
    - tv
    - downloads
    # General-purpose direct-link downloads (aria2), deliberately separate
    # from `downloads` -- that one is scanned/imported by Radarr/Sonarr and
    # shared with qBittorrent; mixing in unrelated manual downloads risks
    # tripping their import logic.
    - general-downloads
  # egbp-nuc looked like the better choice on paper (more NVMe headroom) but
  # its memory *requests* were already at 99% allocated from existing pods
  # (mostly Longhorn replicas) -- actual usage isn't the same as scheduling
  # headroom. egbo has the same NVMe capacity and only 3% memory requested.
  nodeSelector:
    kubernetes.io/hostname: egbo
  tolerations:
    - key: StorageNode
      operator: Equal
      value: "true"
      effect: NoSchedule
  # Hard ceiling -- egbo is also an etcd/control-plane node. Same lesson as
  # the discord-bot OOM incident earlier: never run new workloads there
  # without a resource limit protecting the rest of the node.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

persistence:
  storageClass: longhorn-ssd
  # 800Gi -> 1400Gi: adding /downloads (qBittorrent reports ~243GiB live,
  # via its own API rather than a filesystem walk -- more reliable than du
  # against a volume prone to Remote I/O errors). Movies+tv already use
  # ~522GB, so 800Gi left almost no room; 1400Gi gives real headroom for
  # downloads churn/growth. egbo has >1TB free per NVMe, plenty of room.
  size: 1400Gi
