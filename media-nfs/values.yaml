nfsServer:
  # itsthenetwork/nfs-server-alpine is amd64-only (confirmed via manifest
  # inspection) and fails with "exec format error" on egbo (arm64). This
  # fork is genuinely multi-arch (confirmed linux/arm64 in its manifest).
  image: mekayelanik/nfs-server-alpine:latest
  pullPolicy: IfNotPresent
  # Exports two named shares under /data: /data/movies and /data/tv.
  allowedClient: 10.42.0.0/16 # cluster pod CIDR -- any pod can mount
  exports:
    - movies
    - tv
  # egbp-nuc looked like the better choice on paper (more NVMe headroom) but
  # its memory *requests* were already at 99% allocated from existing pods
  # (mostly Longhorn replicas) -- actual usage isn't the same as scheduling
  # headroom. egbo has the same NVMe capacity and only 3% memory requested.
  nodeSelector:
    kubernetes.io/hostname: egbo
  tolerations:
    - key: StorageNode
      operator: Equal
      value: "true"
      effect: NoSchedule
  # Hard ceiling -- egbo is also an etcd/control-plane node. Same lesson as
  # the discord-bot OOM incident earlier: never run new workloads there
  # without a resource limit protecting the rest of the node.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

persistence:
  storageClass: longhorn-ssd
  size: 800Gi
