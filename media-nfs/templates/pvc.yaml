apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce # Longhorn's more mature/stable path -- no share-manager involved
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
