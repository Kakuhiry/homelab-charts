apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-nfs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC
  selector:
    matchLabels:
      app: media-nfs
  template:
    metadata:
      labels:
        app: media-nfs
    spec:
      nodeSelector:
        {{- toYaml .Values.nfsServer.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.nfsServer.tolerations | nindent 8 }}
      initContainers:
        - name: init-exports
          # exportfs fails validation (and the container exits clean) if the
          # export subdirectories don't already exist -- true on a fresh PVC.
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              set -ex
              {{- range .Values.nfsServer.exports }}
              mkdir -p /data/{{ . }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nfs-server
          image: {{ .Values.nfsServer.image | quote }}
          imagePullPolicy: {{ .Values.nfsServer.pullPolicy }}
          # rpc.nfsd exits non-zero when it can't set up NFSv4 client recovery
          # tracking from inside a network namespace (kernel logs: "attempt to
          # initialize ... client tracking in a container ignored" / "-22").
          # That's expected and harmless in a container -- the nfsd kernel
          # threads still start and serve fine -- but the image's own
          # /usr/bin/nfsd.sh treats any non-zero exit from rpc.nfsd as fatal
          # and tears the whole container down, causing a permanent crash
          # loop even though NFS is actually working underneath. Patch that
          # one call to warn instead of dying, then run the script normally.
          command: ["bash", "-c"]
          args:
            - |
              set -e
              sed -i 's#boot_helper_start_daemon "starting rpc.nfsd.*#log "starting rpc.nfsd on port $port with $threads server thread(s)"; "$PATH_BIN_NFSD" "${args[@]}" || log_warning "rpc.nfsd exited non-zero (expected in a container -- NFSv4 client recovery tracking is restricted in a network namespace; nfsd kernel threads are already running)"#' /usr/bin/nfsd.sh
              exec bash /usr/bin/nfsd.sh
          securityContext:
            privileged: true # required for the in-container NFS kernel server
          resources:
            {{- toYaml .Values.nfsServer.resources | nindent 12 }}
          env:
            - name: ALLOWED_CLIENT
              value: {{ .Values.nfsServer.allowedClient | quote }}
            - name: NFS_SERVER_THREAD_COUNT
              value: {{ .Values.nfsServer.threadCount | quote }}
            - name: NUMBER_OF_SHARES
              value: {{ .Values.nfsServer.exports | len | quote }}
            {{- range $i, $export := .Values.nfsServer.exports }}
            - name: NFS_EXPORT_{{ add $i 1 }}
              value: {{ $export | quote }}
            {{- end }}
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc
              containerPort: 111
              protocol: TCP
            - name: rpc-udp
              containerPort: 111
              protocol: UDP
            - name: aux1
              containerPort: 32765
              protocol: TCP
            - name: aux2
              containerPort: 32766
              protocol: TCP
            - name: aux3
              containerPort: 32767
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-nfs-data
        - name: lib-modules
          hostPath:
            path: /lib/modules
