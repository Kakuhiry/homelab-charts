apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-nfs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC
  selector:
    matchLabels:
      app: media-nfs
  template:
    metadata:
      labels:
        app: media-nfs
    spec:
      nodeSelector:
        {{- toYaml .Values.nfsServer.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.nfsServer.tolerations | nindent 8 }}
      initContainers:
        - name: init-exports
          # exportfs fails validation (and the container exits clean) if the
          # export subdirectories don't already exist -- true on a fresh PVC.
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              set -ex
              {{- range .Values.nfsServer.exports }}
              mkdir -p /data/{{ . }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nfs-server
          image: {{ .Values.nfsServer.image | quote }}
          imagePullPolicy: {{ .Values.nfsServer.pullPolicy }}
          # rpc.nfsd exits non-zero when it can't set up NFSv4 client recovery
          # tracking from inside a network namespace (kernel logs: "attempt to
          # initialize ... client tracking in a container ignored" / "-22").
          # That specific case is expected and harmless -- the nfsd kernel
          # threads still start and serve fine -- but the image's own
          # /usr/bin/nfsd.sh treats ANY non-zero exit from rpc.nfsd as fatal
          # and tears the whole container down, causing a permanent crash
          # loop even when NFS is actually working underneath.
          #
          # rpc.nfsd can also exit non-zero for a genuinely fatal reason --
          # e.g. ENOMEM writing to /proc/fs/nfsd/threads when the node's page
          # cache has crowded out free memory (seen in practice after heavy
          # Longhorn I/O). Blindly treating every non-zero exit as benign
          # masks that case: the container reports "ready" while actually
          # serving nothing, which is worse than crash-looping.
          #
          # So: override boot_main_nfsd to warn (not die) on a non-zero exit,
          # then check /proc/fs/nfsd/threads for the real answer -- retry a
          # few times (transient memory pressure clears on its own), and only
          # then fail loudly if threads genuinely never came up.
          command: ["bash", "-c"]
          args:
            - |
              set -e
              sed '$d' /usr/bin/nfsd.sh > /tmp/nfsd-lib.sh
              source /tmp/nfsd-lib.sh

              boot_main_nfsd() {
                local version_flags
                read -r -a version_flags <<< "$(boot_helper_get_version_flags)"
                local -r threads="${state[$STATE_NFSD_THREAD_COUNT]}"
                local -r port="${state[$STATE_NFSD_PORT]}"
                local args=('--tcp' '--udp' '--port' "$port" "${version_flags[@]}" "$threads")
                is_logging_debug && args+=('--debug')

                log "starting rpc.nfsd on port $port with $threads server thread(s)"
                "$PATH_BIN_NFSD" "${args[@]}" || log_warning "rpc.nfsd exited non-zero -- checking whether nfsd threads actually started (benign if only client recovery tracking failed to init; fatal if the thread pool itself didn't come up)"

                local running=0 attempt
                for attempt in 1 2 3 4 5; do
                  running=$(cat /proc/fs/nfsd/threads 2>/dev/null || echo 0)
                  [[ "$running" -gt 0 ]] && break
                  log_warning "nfsd thread count is 0 (attempt $attempt/5) -- retrying in 3s"
                  sleep 3
                  echo "$threads" > /proc/fs/nfsd/threads 2>/dev/null || true
                done

                if [[ "$running" -eq 0 ]]; then
                  bail "rpc.nfsd never actually started any threads after retries -- this is a real failure (check dmesg on the host node for OOM/ENOMEM), not the benign recovery-tracking case"
                fi
                log "confirmed $running nfsd thread(s) running"

                if ! is_nfs3_enabled; then
                  term_process "$PATH_BIN_RPCBIND"
                fi
              }

              main
          securityContext:
            privileged: true # required for the in-container NFS kernel server
          resources:
            {{- toYaml .Values.nfsServer.resources | nindent 12 }}
          env:
            - name: ALLOWED_CLIENT
              value: {{ .Values.nfsServer.allowedClient | quote }}
            - name: NFS_SERVER_THREAD_COUNT
              value: {{ .Values.nfsServer.threadCount | quote }}
            - name: NUMBER_OF_SHARES
              value: {{ .Values.nfsServer.exports | len | quote }}
            {{- range $i, $export := .Values.nfsServer.exports }}
            - name: NFS_EXPORT_{{ add $i 1 }}
              value: {{ $export | quote }}
            {{- end }}
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc
              containerPort: 111
              protocol: TCP
            - name: rpc-udp
              containerPort: 111
              protocol: UDP
            - name: aux1
              containerPort: 32765
              protocol: TCP
            - name: aux2
              containerPort: 32766
              protocol: TCP
            - name: aux3
              containerPort: 32767
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            # Real host directory, not a PVC subdirectory -- shadows the
            # (harmlessly empty, init-container-created) /data/usb-backup
            # path inside the media-nfs-data PVC. See values.yaml's
            # nfsServer.exports comment for the full why.
            - name: usb-backup
              mountPath: /data/usb-backup
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-nfs-data
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: usb-backup
          hostPath:
            path: /mnt/usb-backup
            type: Directory
