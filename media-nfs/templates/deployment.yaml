apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-nfs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC
  selector:
    matchLabels:
      app: media-nfs
  template:
    metadata:
      labels:
        app: media-nfs
    spec:
      nodeSelector:
        {{- toYaml .Values.nfsServer.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.nfsServer.tolerations | nindent 8 }}
      containers:
        - name: nfs-server
          image: {{ .Values.nfsServer.image | quote }}
          imagePullPolicy: {{ .Values.nfsServer.pullPolicy }}
          securityContext:
            privileged: true # required for the in-container NFS kernel server
          resources:
            {{- toYaml .Values.nfsServer.resources | nindent 12 }}
          env:
            - name: ALLOWED_CLIENT
              value: {{ .Values.nfsServer.allowedClient | quote }}
            - name: NUMBER_OF_SHARES
              value: {{ .Values.nfsServer.exports | len | quote }}
            {{- range $i, $export := .Values.nfsServer.exports }}
            - name: NFS_EXPORT_{{ add $i 1 }}
              value: {{ $export | quote }}
            {{- end }}
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpc
              containerPort: 111
              protocol: TCP
            - name: rpc-udp
              containerPort: 111
              protocol: UDP
            - name: aux1
              containerPort: 32765
              protocol: TCP
            - name: aux2
              containerPort: 32766
              protocol: TCP
            - name: aux3
              containerPort: 32767
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-nfs-data
        - name: lib-modules
          hostPath:
            path: /lib/modules
