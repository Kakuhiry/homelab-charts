apiVersion: v1
kind: Service
metadata:
  name: media-nfs
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  # Pinned: consumers mount this via the in-tree `nfs:` volume type, which
  # kubelet mounts in the *node's* host network namespace -- not the pod's --
  # so cluster DNS (svc.cluster.local) doesn't resolve there. Consumers must
  # address this IP directly, so it needs to never drift.
  clusterIP: 10.43.95.83
  selector:
    app: media-nfs
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
    - name: rpc
      port: 111
      targetPort: 111
      protocol: TCP
    - name: rpc-udp
      port: 111
      targetPort: 111
      protocol: UDP
    - name: aux1
      port: 32765
      targetPort: 32765
      protocol: TCP
    - name: aux2
      port: 32766
      targetPort: 32766
      protocol: TCP
    - name: aux3
      port: 32767
      targetPort: 32767
      protocol: TCP
