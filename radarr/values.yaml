# Default values for radarr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# RollingUpdate deadlocks here: the new pod can't attach the RWO
# radarr-config PVC while the old pod still holds it (same failure mode
# hit with Pi-hole earlier). Recreate avoids the two-pods-want-one-RWO-PVC
# standoff.
strategy:
  type: Recreate

image:
  repository: lscr.io/linuxserver/radarr
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  PUID: "0"
  PGID: "0"
  UMASK: "002"
  TZ: "Etc/UTC"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  targetPort: 7878
  port: 80

ingress:
  enabled: true
  className: "tailscale"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: radarr
  tls:
    - hosts:
       - radarr

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Volume configuration
# - config: radarr-specific (Longhorn RWO)
# - downloads: shared with qbittorrent, served by the dedicated media-nfs
#   server (replaces the old Longhorn RWX PVC, same reasoning as movies below)
# - movies: shared with jellyfin, served by the dedicated media-nfs server
#   (replaces the old Longhorn RWX PVC, which threw frequent Remote I/O
#   errors -- see media-nfs chart. NFSv4 pseudo-root means the export path
#   is /movies, not /data/movies. Server addressed by ClusterIP, not DNS,
#   since the in-tree nfs: volume type is mounted by kubelet in the node's
#   host network namespace where cluster DNS doesn't resolve.)
volumes:
  - name: config
    persistentVolumeClaim:
      claimName: radarr-config-pvc
  - name: downloads
    nfs:
      server: 10.43.95.83
      path: /downloads
  - name: movies
    nfs:
      server: 10.43.95.83
      path: /movies

volumeMounts:
  - name: config
    mountPath: /config
  - name: downloads
    mountPath: /downloads
  - name: movies
    mountPath: /movies

# Only config PVC is managed by this chart (Longhorn RWO)
# Shared media PVCs are managed by media-storage chart
longhorn:
  enabled: true
  persistentVolumes:
    radarr-config:
      storageSize: 2Gi
      storageClassName: longhorn-ssd

nodeSelector: {}

tolerations: []

affinity: {}
