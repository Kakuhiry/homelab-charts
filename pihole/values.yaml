image:
  repository: pihole/pihole
  tag: "2024.07.0"
  pullPolicy: IfNotPresent

# Web admin password — override with a Sealed Secret or external-secrets in production
webPassword: "changeme"

timezone: "America/Santo_Domingo"

# Moved from egbp to egbo (2026-08-31): originally pinned to egbp for its
# static IP, but DNS clients actually point at pihole-dns-lb's advertised
# node IPs (10.0.0.10/23/40 -- k3s ServiceLB), which route to this pod
# wherever it's scheduled regardless of node -- so pinning to a specific
# node's own IP was never actually load-bearing for DNS continuity. Real
# reason for this move: raspberrypi (its home until now) lost its SD card
# (donated to fix egbo's own dead card) and is offline until physically
# replaced. egbo has spare capacity and is otherwise unrelated to DNS.
nodeSelector:
  kubernetes.io/hostname: egbo

# egbo runs Longhorn/media-nfs duty and carries this taint -- see
# ../media-nfs/values.yaml or ../torklink/values.yaml for the same pattern.
tolerations:
  - key: StorageNode
    operator: Equal
    value: "true"
    effect: NoSchedule

persistence:
  storageClass: longhorn-ssd
  # Live PVC was actually expanded to 15Gi at some point outside of git
  # (found 2026-08-31 while registering this app with ArgoCD for the first
  # time -- git said 5Gi, causing every selfHeal sync attempt to fail with
  # "field can not be less than previous value" since PVCs can only grow,
  # never shrink, and the repeated failed-sync retries were churning the
  # Deployment as collateral damage on live DNS).
  size: 15Gi

# LoadBalancer IP for DNS (UDP/TCP port 53)
dnsLoadBalancerIP: ""
