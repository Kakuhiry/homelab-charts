apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: cv-station
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host("{{ .Values.ingress.host }}")
      services:
        - name: cv-station
          port: 80
