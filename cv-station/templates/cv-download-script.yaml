apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-station-scripts
  namespace: {{ .Release.Namespace }}
data:
  # jlesage's docker-baseimage-gui (like linuxserver's webtop before it)
  # runs s6-overlay as PID 1 -- can't just override `command:` without
  # skipping the whole permission-fixing/VNC-startup process. This
  # project's own extension point is /etc/cont-init.d/ (numbered 50-59
  # for custom scripts, per its own docs), run once as root before the
  # GUI session starts. Node.js itself is installed via this image's
  # built-in INSTALL_PACKAGES env var (see values.yaml) -- this script
  # only needs to handle the npm/Playwright part.
  50-setup-cv-tools.sh: |
    #!/bin/sh
    # This base image (jlesage/docker-baseimage-gui) is Alpine, not
    # Debian/Ubuntu -- confirmed live 2026-09-03 via its apk-based
    # package install log. Alpine doesn't ship bash by default, so a
    # #!/bin/bash shebang here failed with "not found" (error 127) and
    # s6-overlay treated that as fatal, crash-looping the whole pod
    # before the VNC service ever started. The script body itself was
    # already POSIX-sh-safe (no bashisms), so only the shebang needed
    # fixing.
    set -e

    # Chromium writes a SingletonLock (+ SingletonSocket/SingletonCookie)
    # into its profile dir to stop two instances sharing one profile --
    # but a pod restart is a hard kill, not a graceful Chromium exit, so
    # this lock survives on the PVC referencing a pod hostname that no
    # longer exists, permanently blocking every future launch with
    # "profile appears to be in use by another Chromium process" (found
    # live 2026-09-03, restarting the pod between two script runs
    # reproduced it every time). Safe to clear exactly once per pod boot,
    # here rather than in cv-download.js itself -- a fresh pod boot means
    # whatever's in that lock is necessarily stale (this container didn't
    # create it), whereas clearing it from inside the script would also
    # defeat the lock's real job of stopping two concurrent runs within
    # the same still-running pod.
    rm -f /config/chrome-profile/Singleton*

    # Only the Playwright JS library itself is installed here -- NOT its
    # own bundled Chromium (that build is glibc-linked and can't run on
    # this Alpine/musl base at all; see values.yaml's INSTALL_PACKAGES
    # comment). The actual browser is Alpine's own native chromium apk
    # package, launched via executablePath in cv-download.js below.
    #
    # The container's root filesystem is ephemeral -- only /config
    # persists (Longhorn PVC) -- so this is gated on a dir check, same
    # pattern already used by this repo's torklink.yaml ttyd manifest for
    # its own npm-install-at-startup approach.
    if [ ! -d /config/node_modules/playwright ]; then
      echo "[cv-station] First boot: installing Playwright..."
      cd /config
      npm install playwright
    else
      echo "[cv-station] Playwright already installed, skipping."
    fi

    # Clean up any stale glibc Chromium download from before this fix
    # (2026-09-03) -- it can't run here and just wastes PVC space.
    rm -rf /config/.cache/ms-playwright

    chown -R "${USER_ID:-1000}:${GROUP_ID:-1000}" /config/node_modules /config/package*.json 2>/dev/null || true

  cv-download.js: |
    const { chromium } = require('playwright');

    (async () => {
      // launchPersistentContext (not launch()) -- by default Playwright
      // launches Chromium against a throwaway, randomly-named profile
      // under /tmp that's deleted the moment the browser closes, so a
      // Google sign-in (or any cookies) would NOT survive even between
      // two runs of this script in the same pod, let alone a pod
      // restart. Pointing the profile at /config (the Longhorn PVC,
      // the only path that actually persists) makes logins/cookies
      // survive both. (Note: this profile is entirely separate from the
      // desktop's own built-in Firefox and its own persisted profile --
      // sign into Google there instead, since that browser was never
      // launched via Playwright/CDP and won't hit Google's "this
      // browser may not be secure" automation check the way this one
      // would.)
      const context = await chromium.launchPersistentContext(
        '/config/chrome-profile',
        {
          headless: false,
          // Alpine's native (musl) chromium package, not Playwright's
          // own bundled one -- see values.yaml's INSTALL_PACKAGES
          // comment for why that one can't run on this base at all.
          executablePath: '/usr/bin/chromium',
        }
      );
      const page = context.pages()[0] || (await context.newPage());
      await page.goto('{{ .Values.cv.url }}');
      await page.waitForTimeout(10000);
      try {
        await page.click('button:has-text("{{ .Values.cv.buttonText }}")', { timeout: 10000 });
      } catch (e) {
        // Confirmed live 2026-09-03: window.print()'s native dialog can
        // block Playwright's own click-confirmation handshake, causing
        // page.click() to time out and throw -- even though the click
        // itself (and the resulting print dialog) already succeeded on
        // screen. Left uncaught, that throw crashes the whole script,
        // which by default also tears down the browser it launched --
        // silently closing the print dialog out from under you. Catching
        // it here just logs a note and moves on; the dialog is still
        // there either way.
        console.log('Click confirmation timed out (this is expected/harmless) -- check the screen, the print dialog should already be open.');
      }
      // window.print() opens Chromium's native print dialog here.
      // Playwright does not intercept this (it only intercepts JS
      // alert/confirm/prompt dialogs) -- it renders normally on-screen,
      // left for you to finish by hand: pick the save location yourself
      // in that dialog, same as if you'd clicked the button manually.
      console.log('Clicked -- finish the save in the print dialog now.');
      await new Promise(() => {}); // keep the browser open indefinitely
    })();
