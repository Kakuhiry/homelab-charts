# aria2 + AriaNg -- paste a direct link (HTTP/HTTPS/FTP/magnet/metalink) in
# the web UI, it downloads server-side instead of to your machine, and you
# pull the finished file over NFS whenever you want. Deliberately separate
# from qBittorrent's downloads folder -- see media-nfs/values.yaml
# (general-downloads export) for why.
#
# Public at aria2.gbklabs.com via Cloudflare Tunnel + Access, same pattern
# as jellyfin/qbittorrent -- NOT Tailscale (an earlier version of this
# chart used tailscale.com/expose, on the mistaken assumption that
# prowlarr/radarr/sonarr's `ingress.className: "tailscale"` reflected a
# real "admin tools stay private" convention here. It doesn't -- that
# setting is silently ignored by the common ingress template regardless of
# chart, so those are actually already fully public with no gate at all.
# Since there's no real private-by-default convention to match, this
# follows the pattern that's actually proven working instead: public +
# Cloudflare Access, matching jellyfin.

replicaCount: 1

strategy:
  type: Recreate

image:
  # hurlenko/aria2-ariang: real, actively maintained, genuinely multi-arch
  # (amd64/arm64/arm -- verified against Docker Hub's manifest, confirmed
  # covers every node type in this cluster). lscr.io/linuxserver/aria2,
  # what I tried first, doesn't exist -- LinuxServer.io has never published
  # an aria2 image. Also what the prior (unfinished) attempt at this chart
  # already used -- their choice was right.
  repository: hurlenko/aria2-ariang
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  targetPort: 8080

# The actual Cloudflare Access policy gating aria2.gbklabs.com isn't
# managed here -- it's Cloudflare account config, not a Kubernetes
# resource. Needs a matching Access Application created same as jellyfin's
# (see 2026-08-13 jellyfin fix commit for context on how that one's set
# up). Until that policy exists, this route is public with no auth.
ingress:
  enabled: true

env:
  PUID: "0"
  PGID: "0"
  # Tells AriaNg's client-side JS which port to make RPC calls back to.
  # Tailscale's ingress terminates HTTPS and presents this on 443 to the
  # browser (default HTTPS port, no :port needed in the URL) even though
  # the Service/container are on 80/8080 internally -- has to match what
  # the browser actually sees, not our internal port. Straight from the
  # image's own docs example, which describes exactly this proxied setup.
  ARIA2RPCPORT: "443"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Config PVC: aria2's own settings + session file (what lets it resume
# in-progress downloads across restarts). Small, Longhorn RWO -- same
# pattern as every other *arr-style app's config volume.
persistence:
  config:
    enabled: true
    isPvc: true
    existingClaim: aria2-config-pvc
  data:
    enabled: false

longhorn:
  enabled: true
  persistentVolumes:
    aria2-config:
      storageSize: 2Gi
      storageClassName: longhorn-ssd

# Downloads land on media-nfs's dedicated general-downloads export (NOT the
# qBittorrent/Radarr/Sonarr-managed `downloads` share -- see media-nfs
# chart comment). Server addressed by ClusterIP, not DNS, since the
# in-tree nfs: volume type is mounted by kubelet in the node's host
# network namespace where cluster DNS doesn't resolve.
extraVolumes:
  - name: downloads
    nfs:
      server: 10.43.95.83
      path: /general-downloads

extraVolumeMounts:
  - name: downloads
    mountPath: /aria2/data

nodeSelector: {}
tolerations: []
affinity: {}
