promtail:
  # Tell Promtail where to push logs.
  # loki-write.monitoring.svc.cluster.local resolves to the Loki service inside
  # the cluster — Promtail never needs to leave the cluster to reach Loki.
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  # The chart already mounts /var/log/pods and /var/log/containers by default —
  # no need to add extraVolumes for those.

  # Tolerate the control-plane node so Promtail runs on every node including
  # the master, giving us logs from system components too.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
