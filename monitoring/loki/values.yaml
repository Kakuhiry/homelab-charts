loki:
  # deploymentMode: SingleBinary means one pod runs everything (ingester, querier,
  # compactor, ruler). Perfect for homelab — no microservices complexity.
  deploymentMode: SingleBinary

  loki:
    # Auth disabled — single-tenant homelab, no need to pass X-Scope-OrgID headers.
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    # Storage config: tell Loki to use S3-compatible (MinIO) for everything.
    # The bucket "loki" was pre-created by the MinIO chart.
    storage:
      type: s3
      # bucketNames is parallel to s3 config, not nested inside it
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      s3:
        endpoint: http://minio.monitoring.svc.cluster.local:9000
        region: us-east-1        # MinIO ignores this but Loki requires a value
        # ${} syntax passes through Helm unchanged and is substituted by Loki
        # at runtime using the env vars injected below via extraEnv.
        accessKeyId: "${MINIO_ACCESS_KEY}"
        secretAccessKey: "${MINIO_SECRET_KEY}"
        s3ForcePathStyle: true   # Required for MinIO (path-style vs virtual-hosted)
        insecure: true           # HTTP not HTTPS to MinIO (internal cluster traffic)

    # Keep logs for 30 days then auto-delete
    limits_config:
      retention_period: 720h    # 720h = 30 days

    compactor:
      retention_enabled: true
      delete_request_store: s3

    # Schema config: boltdb-shipper index + filesystem chunks is old.
    # tsdb is the modern Loki v3 index format — faster queries.
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  # SingleBinary: one replica pod
  singleBinary:
    replicas: 1
    # Enable env var substitution in Loki's config file.
    # Without this flag, ${VAR} syntax in the config is treated as a literal string.
    extraArgs:
      - -config.expand-env=true
    # Inject credentials from the pre-existing Secret into the pod as env vars.
    # Loki's config file uses ${MINIO_ACCESS_KEY} / ${MINIO_SECRET_KEY} which
    # Loki substitutes at startup via the flag above — nothing sensitive in git.
    extraEnv:
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: rootUser
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: rootPassword
    persistence:
      enabled: true
      storageClass: longhorn-ssd
      size: 5Gi               # WAL + local cache only, actual logs go to MinIO

  # Disable all the microservice components — SingleBinary mode only
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # Disable the built-in MinIO (we have our own)
  minio:
    enabled: false

  # Disable Grafana (we'll deploy it separately)
  grafana:
    enabled: false

  # Loki gateway is an nginx proxy in front of Loki — useful for multi-tenant
  # setups. Disable it; Promtail will talk directly to Loki's service.
  gateway:
    enabled: false

  # Loki self-monitoring (uses Prometheus metrics). Disable for now.
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

  test:
    enabled: false
