kube-prometheus-stack:
  # We already have Grafana deployed separately — disable the bundled one.
  grafana:
    enabled: false

  # Prometheus itself: scrapes metrics from all ServiceMonitors in the cluster.
  prometheus:
    prometheusSpec:
      # Scrape every 30s — good balance for homelab.
      scrapeInterval: 30s
      evaluationInterval: 30s
      # Keep 30 days of metrics on disk.
      retention: 30d
      retentionSize: "20GB"
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-ssd
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 25Gi
      # Discover ServiceMonitors from ALL namespaces, not just the release namespace.
      # Without this, Prometheus only scrapes services in its own namespace.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

  # node-exporter: DaemonSet on every node, exposes CPU/RAM/disk/network metrics.
  prometheus-node-exporter:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

  # kube-state-metrics: exposes Kubernetes object state (pod restarts,
  # deployment replicas, PVC status, etc.) as Prometheus metrics.
  kube-state-metrics:
    enabled: true

  # AlertManager: disabled for now, can be enabled later for notifications.
  alertmanager:
    enabled: false

  # These components are built into k3s and don't need separate exporters.
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
