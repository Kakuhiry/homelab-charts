{{/*
  Labels each Longhorn volume to enroll it in its recurring backup job.
  Rendered as individual Volume patches — applied via server-side apply.
*/}}
{{- range .Values.recurringJobs }}
{{- $jobName := .name }}
{{- $groupName := .group }}
{{- range $alias, $volName := .volumes }}
---
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: {{ $volName }}
  namespace: longhorn
  labels:
    recurringjob.longhorn.io/{{ $jobName }}: "enabled"
    recurring-job-group.longhorn.io/{{ $groupName }}: "enabled"
{{- end }}
{{- end }}
