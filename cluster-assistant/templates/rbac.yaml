apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-assistant
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-assistant-readonly
rules:
  # Deliberately explicit resource lists, not resources: ["*"] -- the
  # point is this can never read Secrets, even by accident. A bot whose
  # answers go straight into a Discord channel must not be able to see
  # credential values, full stop.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "services", "persistentvolumeclaims", "persistentvolumes", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "replicas", "engines", "nodes", "backups", "backupvolumes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.containo.us"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-assistant-readonly
subjects:
  - kind: ServiceAccount
    name: cluster-assistant
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-assistant-readonly
  apiGroup: rbac.authorization.k8s.io
