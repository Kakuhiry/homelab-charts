apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot
    spec:
      nodeSelector:
        {{- toYaml .Values.bot.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.bot.tolerations | nindent 8 }}
      containers:
        - name: discord-bot
          image: {{ .Values.bot.image | quote }}
          imagePullPolicy: {{ .Values.bot.pullPolicy }}
          # yt-dlp's Twitter/X extractor breaks often as X changes its
          # internal GraphQL API, independently of this image's own rebuild
          # cadence -- found live 2026-08-28: the image's baked-in pip
          # install (2026.07.04, ~6 weeks stale) failed "No video could be
          # found in this tweet" on tweets that do have a directly-attached
          # video; upgrading to 2026.08.19 fixed it with no cookies/auth
          # needed (tested against a verified-video tweet, both with and
          # without cookies -- cookies made no difference, version did).
          # Rather than wait on an image rebuild each time X breaks this
          # again, self-update yt-dlp on every pod (re)start instead of
          # relying on whatever the image happened to pin at build time.
          command:
            - sh
            - -c
            - |
              pip install --upgrade --break-system-packages yt-dlp
              exec /usr/local/bin/app
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.discordTokenSecretName }}
                  key: token
            - name: SAVE_PATH
              value: {{ .Values.bot.savePath | quote }}
            - name: TEMPORAL_HOST
              value: {{ .Values.bot.temporalHost | quote }}
          volumeMounts:
            - name: torklink-data
              mountPath: {{ .Values.bot.savePath }}
      volumes:
        # Migrated off a Longhorn RWX PVC (2026-08-26) -- that storage class
        # hit the same "Remote I/O error" failure class already documented
        # for media-nfs's other shares, surfaced when Immich tried to scan
        # it. Same NFS server everything else already uses.
        - name: torklink-data
          nfs:
            server: {{ .Values.bot.nfsServer }}
            path: /torklink-videos
