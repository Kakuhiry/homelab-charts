bot:
  image: kakuheiki/vd-downloader:temporal
  pullPolicy: Always # mutable tag, rebuilt frequently during active development
  # Image is built GOARCH=arm64 only -- must land on an arm64 node.
  nodeSelector:
    kubernetes.io/hostname: egbo
  tolerations:
    - key: StorageNode
      operator: Equal
      value: "true"
      effect: NoSchedule
  # Hard ceiling: egbo also runs etcd + Longhorn storage duty for the whole
  # cluster -- see the batch-of-5 download change in the bot itself for the
  # full story on why this exists.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  savePath: /downloads
  temporalHost: temporal-frontend.temporal.svc.cluster.local:7233
  # discord-token secret is managed via templates/discord-bot-token.sops.yaml
  # (SOPS-encrypted, decrypted in-cluster by sops-secrets-operator).
  discordTokenSecretName: discord-bot-token
  # x.com session cookies, needed for tweets X gates behind a login -- see
  # templates/deployment-bot.yaml's command comment for the full story.
  # Managed via templates/x-cookies.sops.yaml (SOPS-encrypted, same as
  # discord-token above); optional at the Deployment level so the pod
  # still starts if this hasn't been created yet.
  cookiesSecretName: torklink-x-cookies
  # media-nfs's ClusterIP (same server already used by jellyfin/radarr/
  # sonarr for movies/tv/downloads -- see ../jellyfin/values.yaml).
  nfsServer: 10.43.95.83
