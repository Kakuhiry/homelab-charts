apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-web
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - name: web
      port: 80
      targetPort: 8233
      protocol: TCP
