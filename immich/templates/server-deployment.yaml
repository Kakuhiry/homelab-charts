apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: immich-server
spec:
  # No fixed replicas/strategy override -- HPA (server-hpa.yaml) owns replica
  # count from here, and the default RollingUpdate strategy is fine now that
  # /data lives on NFS (media-nfs's immich-uploads export, multi-attach
  # capable) instead of the old Longhorn RWO PVC that used to force
  # Recreate + a hard 1-replica ceiling. See postgres-deployment.yaml --
  # Postgres itself is unaffected, still single-replica/Recreate/RWO, since
  # only immich-server needs to scale.
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP
          envFrom:
            - secretRef:
                name: immich-secret
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: UPLOAD_LOCATION
              value: /data
            # Migrations run unconditionally on every boot unless this is
            # set (DB_SKIP_MIGRATIONS) -- harmless for routine HPA replica
            # scaling since there's never anything new to apply between
            # scale events (same image/version), but if this chart's image
            # tag is ever bumped while running >1 replica, scale down to 1
            # first, let it apply migrations, then scale back up -- multiple
            # replicas racing to apply a *new* migration simultaneously
            # isn't something we've verified is safe.
            - name: TZ
              value: Europe/London
            - name: IMMICH_MACHINE_LEARNING_ENABLED
              value: {{ .Values.machineLearning.enabled | quote }}
            {{- if .Values.machineLearning.enabled }}
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            {{- end }}
          volumeMounts:
            - name: upload
              mountPath: /data
            # Read-only: this is torklink's own storage (owned by
            # ../torklink, not this chart) -- Immich should browse/play what
            # the bot downloads, never write into or manage that volume's
            # lifecycle.
            - name: torklink-downloads
              mountPath: {{ .Values.externalLibrary.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        # media-nfs export (multi-attach), not the old Longhorn RWO PVC --
        # required for >1 replica to share UPLOAD_LOCATION simultaneously.
        - name: upload
          nfs:
            server: {{ .Values.upload.nfsServer }}
            path: {{ .Values.upload.nfsPath }}
        - name: torklink-downloads
          nfs:
            server: {{ .Values.externalLibrary.nfsServer }}
            path: {{ .Values.externalLibrary.nfsPath }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
