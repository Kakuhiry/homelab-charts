# Requires immich-server's storage to be multi-attach (media-nfs, see
# values.yaml `upload`) -- the old Longhorn RWO PVC hard-capped this at 1
# replica regardless of what this HPA said, since additional pods couldn't
# attach storage already in use by the running one. See argo-application.yaml
# for the matching ignoreDifferences rule this needs to avoid ArgoCD selfHeal
# fighting the HPA over spec.replicas every reconcile.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-server
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-server
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  # CPU only. Memory was tried and reverted (2026-08-27): confirmed live
  # that immich-server's baseline idle footprint (~850-1090Mi, all Node.js/
  # Nest runtime overhead, not request load) sits permanently above any
  # reasonable memory target regardless of replica count -- watched it
  # runway-scale to maxReplicas (10 idle pods, ~10GB wasted) chasing a
  # target adding more replicas can never satisfy, since per-pod baseline
  # overhead doesn't shrink just because there are more pods. CPU actually
  # reflects real work (thumbnail/video processing is CPU-bound), so it's
  # the metric that maps to "photo uploads process faster," which is the
  # actual goal here.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
