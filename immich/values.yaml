image:
  repository: ghcr.io/immich-app/immich-server
  tag: "v3.1.0"
  pullPolicy: IfNotPresent

# Disabled by default: this deployment exists to browse/play torklink's
# downloaded videos, not to run a personal photo library with facial
# recognition / CLIP smart search. The ML service is the heaviest,
# most resource-hungry component and buys nothing for that use case.
# Flip to true + apply to add it back later -- it's just another
# Deployment/Service, nothing else depends on it being present.
machineLearning:
  enabled: false
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v3.1.0"

postgres:
  image:
    # Immich's own Postgres image, not stock postgres -- bundles the
    # vectorchord/pgvector extensions the server requires. Pinned to the
    # exact tag from the v3.1.0 release's docker-compose.yml.
    repository: ghcr.io/immich-app/postgres
    tag: "14-vectorchord0.4.3-pgvectors0.2.0"

redis:
  image:
    # Immich moved to Valkey (Redis fork) as of its own upstream compose --
    # matching that rather than plain redis.
    repository: docker.io/valkey/valkey
    tag: "9"

ingress:
  host: immich.gbklabs.com

# UPLOAD_LOCATION -- thumbnails, encoded video, and real uploaded photos/
# videos (e.g. phone backup). media-nfs export, not a Longhorn PVC (moved
# 2026-08-27) -- required for horizontalpodautoscaler.yaml's replicas to
# all share the same storage simultaneously; RWO Longhorn hard-capped this
# at 1 replica regardless of what the HPA said.
upload:
  nfsServer: 10.43.95.83
  nfsPath: /immich-uploads

# Same media-nfs export the torklink Discord bot writes to (see
# ../torklink/values.yaml bot.nfsServer) -- migrated off a Longhorn RWX PVC
# (2026-08-26) after it hit "Remote I/O error" mid-scan, the same failure
# class already documented for media-nfs's other shares. Mounted read-only
# here and registered as an Immich External Library (one-time manual step
# via the Admin UI after first login -- see NOTES.txt) rather than
# re-imported into Immich's own upload storage.
externalLibrary:
  nfsServer: 10.43.95.83
  nfsPath: /torklink-videos
  mountPath: /mnt/torklink-downloads

# Keeps the "Torklink Downloads" album in sync with the external library above.
# Immich has no built-in auto-add-to-album feature, so a small CronJob
# (templates/album-sync-cronjob.yaml) re-runs a search-by-library -> bulk-add-to-album
# pass on a schedule -- idempotent, confirmed live (PUT /albums/{id}/assets returns a
# per-asset "duplicate" error rather than failing the whole call for assets already in
# the album). libraryId is the External Library's own id (Administration -> Libraries
# in the Admin UI, or GET /api/libraries) -- there's no declarative way to pin this at
# chart-install time since the library itself is created via a manual one-time step
# (see NOTES.txt), so it's just recorded here once known.
albumSync:
  albumName: "Torklink Downloads"
  libraryId: "4544b822-090b-433f-b65b-34c1aea9f08c"
  # Staggered 15 min after Immich's own hourly library-scan schedule (Administration ->
  # Settings -> Library) so newly-scanned assets are already there by the time this runs.
  schedule: "15 * * * *"

# immich-upload dropped -- moved to the media-nfs export above, no longer a
# chart-managed Longhorn volume.
longhorn:
  enabled: true
  persistentVolumes:
    immich-postgres-data:
      storageSize: 20Gi
      storageClassName: longhorn-ssd

# Cluster has ~18.6 CPU / ~33GB free by request-accounting across all 5
# nodes as of 2026-08-27 (kubectl describe nodes, Allocated resources).
# Sized generously against that for real per-pod throughput headroom (photo
# backup uploads/thumbnail generation are CPU-bound), while still leaving
# room for everything else running here. At full HPA scale-out
# (maxReplicas: 10, see server-hpa.yaml) this is 5 CPU / 10Gi *requested* --
# well within headroom -- and up to 30 CPU / 30Gi at *limits* if every pod
# bursts simultaneously, which is expected to be oversubscribed (limits
# aren't a scheduling guarantee, only a per-pod ceiling) rather than
# something the whole cluster could sustain at once.
resources:
  server:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 3Gi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  redis:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

hpa:
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

nodeSelector: {}
tolerations: []
