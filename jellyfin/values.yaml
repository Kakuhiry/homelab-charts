replicaCount: 1

hostNetwork: false

port: 8096
hostPort:
  enabled: false
  port: 8096

image:
  repository: docker.io/linuxserver/jellyfin
  pullPolicy: Always
  tag: '10.11.11'

serviceAccount:
  create: false

podAnnotations:
  deploy-version: "10.11.11"

podSecurityContext: {}

securityContext:
  capabilities:
    add:
      - NET_ADMIN

strategy:
  type: Recreate

service:
  type: NodePort
  port: 80
  targetPort: 8096
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: jellyfin-session
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"

ingress:
  enabled: true

# See templates/slashfix.yaml for the full explanation: Cloudflare Tunnel
# strips trailing slashes from request paths before they reach the
# origin, which breaks Jellyfin's own /web -> /web/ redirect into an
# infinite loop (confirmed via header capture, 2026-08-13). Only affects
# jellyfin.gbklabs.com (Cloudflare Tunnel) -- LAN/Traefik access was never
# affected. Inserts a tiny nginx relay to compensate.
slashFix:
  enabled: true

# Config PVC managed by this chart (Longhorn RWO)
longhorn:
  enabled: true
  persistentVolumes:
    jellyfin-config:
      storageSize: 100Gi
      storageClassName: longhorn-ssd

resources:
  limits:
    nvidia.com/gpu: '1'

# Formalizes what was previously live-only drift: someone kubectl-edited this
# onto the running Deployment (needed for NVIDIA GPU passthrough) but it was
# never committed here. Safe to have drifted since jellyfin's ArgoCD
# Application has selfHeal: false (see argo-application.yaml) -- but if this
# chart were ever recreated from git alone, GPU transcoding would silently
# stop working without this.
runtimeClassName: nvidia

nodeSelector:
  kubernetes.io/hostname: egbp-pc
tolerations: []
affinity: {}

# Forced into encoding.xml's HardwareAccelerationType on every container
# start by templates/configmap-hwaccel-init.yaml, since jellyfin-config-pvc
# is shared with the secondary (Intel) variant -- see that file's comment
# for the full why. Must match the actual GPU on nodeSelector's node above.
hwaccelType: nvenc

# Passive secondary (egbp-nuc, Intel iGPU) -- used only by
# templates/deployment-secondary.yaml, scaled 0<->1 exclusively by the
# jellyfin-failover CronJob (../jellyfin-failover/) based on egbp-pc's node
# health. Only the fields that actually differ from the primary live here;
# everything else (image, env, extraVolumes, persistence.config -- same
# jellyfin-config-pvc, strategy, probes) is reused directly from the shared
# values above, same as deployment.yaml does. Deliberately no
# runtimeClassName -- Intel iGPU passthrough via /dev/dri needs no special
# container runtime, unlike NVIDIA.
secondary:
  nodeSelector:
    kubernetes.io/hostname: egbp-nuc
  resources:
    limits:
      gpu.intel.com/i915: '1'
  # See hwaccelType above -- Intel QuickSync backend, matches egbp-nuc's iGPU.
  hwaccelType: qsv

env:
  PUID: "0"
  PGID: "0"
  TZ: "Europe/London"

secretEnv: {}

dnsConfig: {}
dnsPolicy: ClusterFirst

# Config persistence - jellyfin specific (Longhorn RWO)
persistence:
  config:
    enabled: true
    isPvc: true
    existingClaim: jellyfin-config-pvc
  data:
    enabled: false  # Using extraVolumes for shared media

# Shared media volumes, served by the dedicated media-nfs server (replaces
# the old Longhorn RWX PVCs, which threw frequent Remote I/O errors -- see
# media-nfs chart. NFSv4 pseudo-root means export paths are /movies and /tv,
# not /data/movies or /data/tv. Server addressed by ClusterIP, not DNS,
# since the in-tree nfs: volume type is mounted by kubelet in the node's
# host network namespace where cluster DNS doesn't resolve.)
extraVolumes:
  - name: dri
    hostPath:
      path: /dev/dri
  - name: tv
    nfs:
      server: 10.43.95.83
      path: /tv
  - name: movies
    nfs:
      server: 10.43.95.83
      path: /movies

extraVolumeMounts:
  - name: dri
    mountPath: /dev/dri
  - name: tv
    mountPath: /data/tvshows
  - name: movies
    mountPath: /data/movies

livenessProbe: {}
readinessProbe: {}
initContainers: []
sidecarContainers: []
additionalPorts: []
additionalServicePorts: []
