{{/*
Secondary (passive) Jellyfin Deployment, pinned to egbp-nuc's Intel iGPU.

replicas is intentionally hardcoded to 0 here (not driven by
.Values.replicaCount -- that's the primary's) so ArgoCD's declared state
always represents "failover not engaged". It is scaled 0<->1 exclusively by
the jellyfin-failover CronJob (../../jellyfin-failover/) in response to
egbp-pc node health. This is safe only because the jellyfin ArgoCD
Application has syncPolicy.automated.selfHeal: false (see
argo-application.yaml) -- if that ever changes, ArgoCD will fight the
CronJob's live replica changes on every reconcile. Do not "fix" that.

Carries the same app.kubernetes.io/name + app.kubernetes.io/instance labels
as the primary so the jellyfin-real Service (templates/service.yaml,
selector = jellyfin.selectorLabels only) routes to whichever Deployment is
actually scaled up -- but adds variant: secondary (mirrored by
variant: primary on the primary, see deployment.yaml) so the two
Deployments' own spec.selector.matchLabels stay disjoint, per Kubernetes'
warning against two Deployments both trying to own the same pods.

Mounts the same jellyfin-config-pvc as the primary (via the shared
.Values.persistence.config), so library/users/watch-history/settings are
identical across failover -- only one pod can hold this RWO PVC at a time,
which the failover CronJob's cleanup step accounts for.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellyfin.fullname" . }}-secondary
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
    variant: secondary
spec:
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  replicas: 0
  selector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
      variant: secondary
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jellyfin.selectorLabels" . | nindent 8 }}
        variant: secondary
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jellyfin.serviceAccountName" . }}
      {{- /* No runtimeClassName: Intel iGPU passthrough via /dev/dri needs no special container runtime, unlike NVIDIA on the primary. */}}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: data
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "jellyfin.fullname" . }}
            - secretRef:
                name: {{ include "jellyfin.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.hostPort.port }}
              {{- end }}
            {{- with .Values.additionalPorts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.secondary.resources | nindent 12 }}
      {{- with .Values.sidecarContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.secondary.nodeSelector | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
        {{- if .Values.persistence.config.enabled }}
          {{- if .Values.persistence.config.isPvc }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim | default (include "jellyfin.configPvcName" .) }}
          {{- else }}
          {{- with .Values.persistence.config.customVolume }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: data
        {{- if .Values.persistence.data.enabled }}
          {{- if .Values.persistence.data.isPvc }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (include "jellyfin.dataPvcName" .) }}
          {{- else }}
          {{- with .Values.persistence.data.customVolume }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
