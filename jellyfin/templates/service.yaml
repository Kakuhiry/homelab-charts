apiVersion: v1
kind: Service
metadata:
  name: {{ include "jellyfin.fullname" . }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      {{- if .Values.slashFix.enabled }}
      targetPort: 80
      {{- else }}
      targetPort: http
      {{- end }}
      protocol: TCP
      name: http
    {{- with .Values.additionalServicePorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- if .Values.slashFix.enabled }}
    # see templates/slashfix.yaml -- routes through the trailing-slash
    # relay instead of the Jellyfin pods directly
    app: {{ include "jellyfin.fullname" . }}-slashfix
    {{- else }}
    {{- include "jellyfin.selectorLabels" . | nindent 4 }}
    {{- end }}
