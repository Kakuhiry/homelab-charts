apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:Kakuhiry/homelab-charts.git
    targetRevision: HEAD
    path: jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      # Must stay false: the jellyfin-failover CronJob (../jellyfin-failover/)
      # scales this chart's two Deployments (jellyfin <-> jellyfin-secondary)
      # live, outside of git, based on egbp-pc node health. If this were
      # true, ArgoCD would revert those scale operations on its next
      # ~3-minute reconcile and silently break automated failover.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true

