# cloudflare-api-token Secret is managed via cloudflare-api-token.sops.yaml
# in this same templates/ dir (SOPS-encrypted). It used to be templated here
# from .Values.cloudflare.apiToken, but that value was never actually set
# anywhere in git -- meaning a full re-sync of this chart would have
# rendered an empty token and silently clobbered the real (out-of-band)
# secret. Removed in favor of the SopsSecret.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  namespace: cert-manager
spec:
  acme:
    email: {{ .Values.certIssuer.email }}
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: issuer-letsencrypt
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-api-token
            email: {{ .Values.certIssuer.email }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: kube-system
spec:
  secretName: wildcard-secret
  dnsNames:
    - "*.gbklabs.com"
    - "gbklabs.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.containo.us/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-secret